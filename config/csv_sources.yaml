csv_sources:

  - source_id: "phase6_sales"
    source_type: "csv"
    description: "Dữ liệu bán hàng mẫu cho lần chạy local đầu tiên"
    file_path: "data/samples/phase6_sales.csv"
    sep: ","
    target_staging_table: "staging.phase6_sales"
    incremental: true
    watermark_column: "sale_date"
    load_mode: "upsert"
    upsert_key:
      - "sale_id"
    stream_to_staging: false
    chunksize: 5000

  - source_id: "stream_distro"
    source_type: "csv"
    file_path: "data/fact_view_stream.csv"
    sep: ","
    target_staging_table: "staging.stream_distro"
    load_mode: "truncate"
    stream_to_staging: false
    chunksize: 5000
  - source_id: "usd_rate"
    source_type: "fx"
    start_date: "2025-06-01"
    currency: "vnd"
    target_staging_table: "staging.usd_rate"
    load_mode: "truncate"
    stream_to_staging: false
    batch_days: 30
