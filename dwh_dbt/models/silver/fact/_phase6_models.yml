version: 2

models:
  - name: fact_phase6_sales
    description: "Silver fact mẫu được chuẩn hóa từ staging.phase6_sales"

    columns:
      - name: sale_id
        description: "Khóa nghiệp vụ của giao dịch"
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

      - name: amount
        description: "Giá trị giao dịch đã được chuẩn hóa thành numeric(18,2)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: sale_date
        data_tests:
          - not_null

      - name: _batch_id
        data_tests:
          - not_null